name: iOS Build (.ipa)

# 触发方式：
#  1. 手动触发（推荐）：GitHub 仓库页面 → Actions → iOS Build → Run workflow
#  2. 推送代码到 main 分支时自动触发
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        type: choice
        options:
          - unsigned_ipa   # 未签名 ipa（免费 Apple ID + Sideloadly/AltStore 安装）
          - archive        # 仅 xcarchive（有付费证书时后续导出）
        default: unsigned_ipa
  push:
    branches: [ main ]

# 关键限制：iOS 编译必须在 macOS 上执行
jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        # Windows 提交时 gradlew 可执行位可能丢失，macOS runner 上 ./gradlew 会报 Permission denied。
        # 永久修复已在仓库中（git update-index --chmod=+x gradlew），这里做兜底。
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ls -la ./gradlew
          else
            echo "gradlew not found at repo root; listing repo:"
            ls -la
            exit 1
          fi

      - name: Select newest Xcode (match xcodegen/pod format)
        # 关键：xcodegen 和最新 CocoaPods 会生成 Xcode16 格式(77)的 .xcodeproj，
        # 必须用相同版本的 Xcode 编译，否则报 "future Xcode project file format (77)"。
        # runner 上通常有多个 Xcode，这里统一选最新版并让后续步骤全部使用。
        run: |
          echo "=== 可用 Xcode ==="
          ls /Applications/ | grep -i xcode || true
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "选中: $XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Setup JDK 17 (required by Kuikly KMP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Java
        run: java -version && echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Install XcodeGen 2.38.0 (generates Xcode15-compatible format)
        # xcodegen 2.42+ 默认生成 Xcode16 格式(77)，若 runner 只有 Xcode15 会打不开。
        # 固定 2.38.0（Xcode15 时代）生成格式 56，兼容性最广（旧格式新 Xcode 可开）。
        # 直接从 GitHub Release 下载二进制，避免 brew tap trust 问题。
        run: |
          curl -sL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -o /tmp/xcodegen.zip -d /tmp/xcodegen-bin
          sudo mkdir -p /usr/local/bin
          sudo cp /tmp/xcodegen-bin/usr/local/bin/xcodegen /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate iOS project (xcodegen)
        working-directory: iosApp
        run: xcodegen generate

      # ===== 关键步骤：先编译 dummy framework =====
      # Kuikly shared podspec 的 vendored_frameworks 指向 gradle 编译出的 framework，
      # 不先生成 stub，pod install 的 linker flags 会不对，运行时 SIGABRT。
      - name: Generate dummy framework (Kuikly prerequisite)
        run: ./gradlew :shared:generateDummyFramework --console=plain

      - name: Install CocoaPods deps
        working-directory: iosApp
        run: |
          # 固定 CocoaPods 1.15.2（Xcode15 时代）：最新版会生成 Xcode16 格式(77) 的
          # Pods.xcodeproj，与旧 Xcode 不兼容。runner 自带新版则先卸载再装固定版。
          sudo gem uninstall cocoapods -a -x 2>/dev/null || true
          sudo gem install cocoapods -v 1.15.2 -N --no-document
          pod --version
          pod install --repo-update

      - name: List workspace
        working-directory: iosApp
        run: ls -la

      # ===== 构建（禁用签名，产出未签名 app）=====
      - name: Build app (unsigned, device)
        working-directory: iosApp
        run: |
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built .app
        working-directory: iosApp
        id: app_path
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"
          echo "found: $APP"

      # ===== 打未签名 .ipa（Payload 结构）=====
      # 免费 Apple ID 无法在 CI 签名；下载后用 Sideloadly/AltStore 免费签名安装（7天有效期）
      - name: Package unsigned .ipa
        working-directory: iosApp
        if: github.event.inputs.build_type != 'archive'
        run: |
          APP="${{ steps.app_path.outputs.APP_PATH }}"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry ../ChaijieApp-unsigned.ipa Payload
          cd ..
          ls -la ChaijieApp-unsigned.ipa
          echo "IPA_READY=yes" >> "$GITHUB_ENV"

      # ===== 打 .xcarchive（有付费证书后导出用）=====
      - name: Archive (for future signed export)
        working-directory: iosApp
        if: github.event.inputs.build_type == 'archive'
        run: |
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChaijieApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      # ===== 上传产物 =====
      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        if: github.event.inputs.build_type != 'archive'
        with:
          name: ChaijieApp-unsigned-ipa
          path: iosApp/ChaijieApp-unsigned.ipa
          retention-days: 14

      - name: Upload .xcarchive artifact
        uses: actions/upload-artifact@v4
        if: github.event.inputs.build_type == 'archive'
        with:
          name: ChaijieApp-xcarchive
          path: iosApp/build/ChaijieApp.xcarchive
          retention-days: 14
